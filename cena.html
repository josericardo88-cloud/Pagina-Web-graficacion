            ellipse(180,150,12,7);

            strokeWeight(2);
            line(185,170,215,195);
            line(195,165,225,190);

            fill(255,110,0);
            ellipse(225,185,10,10);
            ellipse(230,195,9,9);
            ellipse(218,192,8,8);
            ellipse(235,188,7,7);

            fill(255,170,190);
            ellipse(300,115,30,20);
            ellipse(305,120,25,15);

            stroke(110,70,30);
            strokeWeight(5);
            line(40,360,340,260);
            stroke(130,85,40);
            strokeWeight(3);
            line(50,370,350,270);

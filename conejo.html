</head>
<body>
    <header>
        <h1>Proyecto: Dientes de conejo</h1>
        <nav>
            <a href="index.html">Inicio</a>

        </nav>
    </header>
    <main>
        <h2>Ilustración de Conejo</h2>
        <div class="canvas-container" id="canvas-conejo"></div>
    </main>
    <script>
        function setup() {
            let c = createCanvas(400, 400);
            c.parent("canvas-conejo");
            background(220);

            var eyeSize = 20;

            ellipse(150, 70, 60, 120);  // left ear
            ellipse(240, 70, 60, 120);  // right ear

            ellipse(200, 170, 150, 150);    // face

            fill(0, 0, 0);
            ellipse(170, 150, eyeSize, eyeSize);  // left eye
            ellipse(230, 150, eyeSize, eyeSize);  // right eye

            line(150, 200, 250, 200);   // mouth

            var toothSize = 20;

            noFill();
            rect(185, 200, 15, toothSize); // left tooth
            rect(200, 200, 15, toothSize); // right tooth
        }
    </script>
</body>
</html>
